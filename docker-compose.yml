services:
   jig:
      container_name: jig__dev
      build:
         context: .
         dockerfile: ./docker/jig/dockerfile
      image: oktarintentakel/jig
      volumes:
         - .:/project
      ports:
         - 443:443
         - 3000:3000
         - 3001:3001
      working_dir: /project
      environment:
         - TERM=xterm-256color
         - LANG=C.UTF-8
         - NODE_ENV=development
      command: bash -c "yarn run examples"
